
name: LiteFX Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  arch:
    name: Build Arch Linux package
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git curl pipewire gtk3 zita-convolver pkgconf

      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -Fxq "pkgver=${VERSION}" packaging/arch/PKGBUILD

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- bash -c \
            'cd "$GITHUB_WORKSPACE/packaging/arch" && makepkg --noconfirm'

      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  debian:
    name: Build Debian package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            pkg-config \
            libpipewire-0.3-dev \
            libgtk-3-dev \
            libzita-convolver-dev

      - name: Validate version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(dpkg-parsechangelog -SVersion)" = "${VERSION}-1"

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../litefx_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/*.deb
          if-no-files-found: error

  nix:
    name: Check Nix build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -Fq "version = \"${VERSION}\";" flake.nix

      - name: Build LiteFX
        run: |
          nix build .#default \
            --no-link \
            --print-build-logs

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - arch
      - debian
      - nix

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.pkg.tar.zst

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1838"/>
      <stop offset="100%" stop-color="#0e1017"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="#312e52" stroke-width="2"/>

  <!-- EQ Faders / Spectrum Bars -->
  <rect x="24" y="60" width="8" height="42" rx="4" fill="#33384f"/>
  <rect x="24" y="74" width="8" height="28" rx="4" fill="url(#glowGrad)"/>

  <rect x="40" y="44" width="8" height="58" rx="4" fill="#33384f"/>
  <rect x="40" y="52" width="8" height="50" rx="4" fill="url(#glowGrad)"/>

  <rect x="56" y="32" width="8" height="70" rx="4" fill="#33384f"/>
  <rect x="56" y="42" width="8" height="60" rx="4" fill="url(#glowGrad)"/>

  <rect x="72" y="40" width="8" height="62" rx="4" fill="#33384f"/>
  <rect x="72" y="56" width="8" height="46" rx="4" fill="url(#glowGrad)"/>

  <rect x="88" y="54" width="8" height="48" rx="4" fill="#33384f"/>
  <rect x="88" y="68" width="8" height="34" rx="4" fill="url(#glowGrad)"/>

  <!-- Crystalizer Diamond Sparkle -->
  <polygon points="64,18 73,28 64,38 55,28" fill="url(#accentGrad)"/>
  <polygon points="64,22 70,28 64,34 58,28" fill="#ffffff" opacity="0.85"/>
  <circle cx="86" cy="30" r="2.5" fill="#38bdf8"/>
  <circle cx="42" cy="36" r="1.8" fill="#a78bfa"/>
</svg>
